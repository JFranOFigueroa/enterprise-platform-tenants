global:
  environment: production
tenant:
  id: test1
  displayName: Test Tenant
  company: Test Company
postgresql:
  auth:
    database: test1
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: local-path
backend:
  image:
    tag: v1.0.0-dev.17
frontend:
  image:
    tag: v1.0.0-dev.4
  vueAppApiUrl: /check-it-1.0.0-dev.17/api/v1/
liquibase:
  image:
    tag: v0.0.1-dev.1
config:
  dbUrl: jdbc:postgresql://test1-iumbit-postgresql:5432/test1
  checkitFrontRegisterView: https://test1.iumbit.com.mx/register
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-production
  hosts:
  - host: test1.iumbit.com.mx
    paths:
    - path: /
      pathType: Prefix
      serviceName: frontend
      servicePort: 8080
    - path: /check-it-1.0.0-dev.17
      pathType: Prefix
      serviceName: backend
      servicePort: 8080
  tls:
  - secretName: test1-iumbit-tls
    hosts:
    - test1.iumbit.com.mx
secrets:
  sealed: true
  encryptedData:
    DB_USERNAME: 
    DB_PASSWORD: 
    JWT_SECRET_KEY: 
    GOOGLE_CLIENT_ID: 
    GOOGLE_CLIENT_SECRET: 
    MICROSOFT_CLIENT_ID: 
    MICROSOFT_TENANT_ID: 
    MAIL_USERNAME: 
    MAIL_PASSWORD: 
